@if (executedResult) {
  <div class="table-scroll">
    @if (executedTable?.length) {
      <table
        mat-table
        [dataSource]="executedTable"
        class="mat-elevation-z2 w-full"
        >
        <!-- Columns -->
        @for (colName of displayColumns; track colName) {
          <ng-container matColumnDef="{{ colName }}">
            <th class="font-weight ws-mat-primary-text ws-mat-primary-lite-background-on-day" mat-header-cell *matHeaderCellDef>{{ colName }}</th>
            <td mat-cell *matCellDef="let element">{{ element[colName] }}</td>
          </ng-container>
        }
        <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>
      </table>
    }
  </div>
}
