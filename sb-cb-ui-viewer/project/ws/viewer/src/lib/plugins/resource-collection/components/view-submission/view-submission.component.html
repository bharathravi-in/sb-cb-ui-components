<ng-container>
  <div class="flex flex-between">
    <h2 mat-dialog-title class="font-weight-bold title margin-right-xs" i18n>
      Submission
    </h2>
    <button mat-dialog-close mat-icon-button class="float-right cursor-pointer" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</ng-container>
@if (submissionAnswerText.length>0) {
  <mat-dialog-content class="w-full">
    <div class="textView">
      @for (answers of submissionAnswerText; track answers) {
        <div>
          <p>{{answers}}</p>
        </div>
      }
    </div>
  </mat-dialog-content>
}
@if (pdfData|| videoData) {
  <mat-dialog-content class="h-full pdfVideoPadding">
    @if (pdfData) {
      <ws-widget-player-pdf [widgetData]="pdfData"></ws-widget-player-pdf>
    }
    @if (videoData) {
      <ws-widget-player-video [widgetData]="videoData"></ws-widget-player-video>
    }
  </mat-dialog-content>
}
