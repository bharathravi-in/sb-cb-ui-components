<div class="assessment-preview-dialog">
  <button mat-icon-button class="close-button" [mat-dialog-close]="true">
    <mat-icon class="close-icon">close</mat-icon>
  </button>
  @if (!isFetchingDataComplete || !testData) {
    <div class="margin-m">
      <div class="flex flex-center">
        <mat-spinner></mat-spinner>
      </div>
    </div>
  }
  @if (testData && isFetchingDataComplete) {
    @if (isFetchingDataComplete) {
      <viewer-practice-container [isFetchingDataComplete]="isFetchingDataComplete"
        [isErrorOccured]="isErrorOccured" [quizData]="testData" [forPreview]="forPreview" [quizJson]="quizJson"
        [fromCreation]="true">
      </viewer-practice-container>
    }
  }
</div>
